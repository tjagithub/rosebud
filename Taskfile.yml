version: "3"

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format code (gofumpt, goimports)
    cmds:
      - golangci-lint fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - govulncheck ./...

  complexity:
    desc: Show the most cognitively complex functions
    cmds:
      - cccc --table --top-cognitive 5 .

  build:
    desc: Build the rose binary (CGO disabled)
    cmds:
      - go build -o rose ./cmd/rose

  check:
    desc: Everything to run before a commit
    cmds:
      - task: tidy
      - task: fmt
      - task: vet
      - task: lint
      - task: test
